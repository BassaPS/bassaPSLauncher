<!DOCTYPE html>
<html lang="en" data-theme="bassaps">

<head>
    <meta charset="UTF-8" />
    <script>
      try {
        const preference = JSON.parse(localStorage.getItem('bassaps-ui-preferences') || '{}').state?.theme || 'system';
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'bassaps' : 'bassaps-light';
        document.documentElement.classList.toggle('dark', dark);
      } catch { /* Keep the safe default palette when storage is unavailable. */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/appicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BASSAPS Launcher</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
